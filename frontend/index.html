<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Use the 192px PNG as primary favicon (served on production) -->
    <link rel="icon" type="image/png" href="/footballpro-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>X Talenti</title>
    <!--
      GitHub Pages SPA fallback (pjesa 2): rikthen path-in e ruajtur nga
      404.html përpara se React Router të inicializohet.
      Referencë: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
