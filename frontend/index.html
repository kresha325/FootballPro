<!doctype html>
<html lang="sq" translate="yes">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Use the 192px PNG as primary favicon (served on production) -->
    <link rel="icon" type="image/png" href="/footballpro-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta http-equiv="Content-Language" content="sq" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>X TALENTI</title>
    <meta
      name="description"
      content="X TALENTI — rrjet social për futboll: lojtarë, trajnerë, skautë dhe klube. Profil, video, turne dhe CV dixhitale."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="X TALENTI" />
    <meta property="og:title" content="X TALENTI" />
    <meta
      property="og:description"
      content="Rrjet social për futboll. Lidh talentet me klubet — profil, video, turne dhe CV dixhitale."
    />
    <meta property="og:url" content="https://xtalenti.com/" />
    <!-- Same-origin OG image (1200x630). Must be publicly reachable for Facebook scrapers. -->
    <meta property="og:image" content="https://xtalenti.com/og-share.jpg" />
    <meta property="og:image:secure_url" content="https://xtalenti.com/og-share.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="sq_AL" />
    <!-- Injected at build when VITE_FACEBOOK_APP_ID / FACEBOOK_APP_ID is set -->
    <!--fb:app_id-->
    <link rel="image_src" href="https://xtalenti.com/og-share.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="X TALENTI" />
    <meta
      name="twitter:description"
      content="Rrjet social për futboll. Lidh talentet me klubet — profil, video, turne dhe CV dixhitale."
    />
    <meta name="twitter:image" content="https://xtalenti.com/og-share.jpg" />
    <script>
      // GitHub Pages SPA fallback decoder: rikthen URL nga formati /?/feed
      // (i krijuar nga 404.html) në formatin normal /feed, para se
      // react-router-dom të marrë kontrollin. Referencë: rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
