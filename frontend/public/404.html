<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <title>XTalenti</title>
    <!--
      Fallback për GitHub Pages (rafgraph/spa-github-pages).
      Në deploy prod, ky skedar zakonisht mbivendoset me dist/index.html
      nga scripts/spa-github-pages.mjs që SPA të ngarkohet menjëherë.
      Ky redirect mbetet si backup nëse kopjimi dështon.
    -->
    <script>
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
