server {
    listen 80;
    server_name mediasoup.example.com; # CHANGE to your domain

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name mediasoup.example.com; # CHANGE

    ssl_certificate /etc/letsencrypt/live/mediasoup.example.com/fullchain.pem; # obtain via certbot
    ssl_certificate_key /etc/letsencrypt/live/mediasoup.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy websocket signaling to mediasoup server (running on localhost:4000)
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 36000s;
        proxy_send_timeout 36000s;
    }

    # Optional health endpoint proxy (if mediasoup exposes one)
    location /api/mediasoup/health {
        proxy_pass http://127.0.0.1:4000/api/mediasoup/health;
    }
}
