name: Run production migrations

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  migrate:
    name: Run migrations on production DB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          npm ci

      - name: Verify required secrets (optional)
        id: verify_secrets
        working-directory: backend
        env:
          PROD_PGHOST: ${{ secrets.PROD_PGHOST }}
          PROD_PGUSER: ${{ secrets.PROD_PGUSER }}
          PROD_PGPASSWORD: ${{ secrets.PROD_PGPASSWORD }}
          PROD_PGDATABASE: ${{ secrets.PROD_PGDATABASE }}
          PROD_PGPORT: ${{ secrets.PROD_PGPORT }}
          FOOTBALLPRO_API_URL: ${{ secrets.FOOTBALLPRO_API_URL }}
        run: |
          set -e
          missing=0
          for v in PROD_PGHOST PROD_PGUSER PROD_PGPASSWORD PROD_PGDATABASE PROD_PGPORT FOOTBALLPRO_API_URL; do
            if [ -z "${!v}" ]; then
              echo "Missing: $v"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "have_secrets=false" >> $GITHUB_OUTPUT
            echo "One or more required GitHub secrets are missing; skipping migrations. If you manage DB on Render, run migrations there or add secrets to GitHub." >&2
          else
            echo "have_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Sequelize migrations
        if: ${{ steps.verify_secrets.outputs.have_secrets == 'true' }}
        working-directory: backend
        env:
          PGHOST: ${{ secrets.PROD_PGHOST }}
          PGUSER: ${{ secrets.PROD_PGUSER }}
          PGPASSWORD: ${{ secrets.PROD_PGPASSWORD }}
          PGDATABASE: ${{ secrets.PROD_PGDATABASE }}
          PGPORT: ${{ secrets.PROD_PGPORT }}
          NODE_ENV: production
        run: |
          export DATABASE_URL="$(node -e "const u=encodeURIComponent(process.env.PGUSER); const p=encodeURIComponent(process.env.PGPASSWORD); const h=process.env.PGHOST; const port=process.env.PGPORT||5432; const db=encodeURIComponent(process.env.PGDATABASE); process.stdout.write('postgresql://'+u+':'+p+'@'+h+':'+port+'/'+db+'?sslmode=require');")"
          npx sequelize-cli db:migrate --env production

      - name: Backend health check
        if: ${{ steps.verify_secrets.outputs.have_secrets == 'true' }}
        env:
          FOOTBALLPRO_API_URL: ${{ secrets.FOOTBALLPRO_API_URL }}
        run: |
          set -e
          echo "Checking backend health at $FOOTBALLPRO_API_URL/health"
          curl -fsS "$FOOTBALLPRO_API_URL/health" || (echo 'Health check failed' && exit 1)

      - name: Fail when production database secrets are missing
        if: ${{ steps.verify_secrets.outputs.have_secrets == 'false' }}
        run: |
          echo "GitHub Secrets for the production database are not set, so this workflow did not migrate."
          echo "Add PROD_PGHOST, PROD_PGUSER, PROD_PGPASSWORD, PROD_PGDATABASE, PROD_PGPORT and FOOTBALLPRO_API_URL, or remove this workflow if Render runs migrations itself."
          exit 1

      - name: Notify success
        if: ${{ steps.verify_secrets.outputs.have_secrets == 'true' && success() }}
        run: echo "Migrations completed and health check OK"
