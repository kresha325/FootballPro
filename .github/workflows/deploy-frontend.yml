name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - production
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_APP_NAME: XTalenti
          VITE_API_URL: https://footballpro.onrender.com/api
        run: npm run build
        # npm run build → vite build + scripts/spa-github-pages.mjs
        # (kopjon index.html → 404.html që /feed, /profile/:id të hapen)

      - name: Add custom domain (CNAME)
        run: echo "xtalenti.com" > dist/CNAME

      - name: Verify SPA 404 fallback
        run: |
          test -f dist/404.html
          grep -q 'id="root"' dist/404.html
          test -f dist/feed.html
          grep -q 'id="root"' dist/feed.html
          echo "SPA fallback OK (404.html + feed.html)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
